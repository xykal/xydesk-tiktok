name: Render

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'remotion.config.ts', '.github/workflows/render.yml']

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Chromium untuk Remotion
        run: npx remotion browser ensure
      - name: Render 720x1280 @ 60 fps
        run: npm run render
      - name: Preview still
        run: npm run still
      - name: Info berkas
        run: ls -la out && npx remotion ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of csv=p=0 out/xydesk-tiktok.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xydesk-tiktok-mp4
          path: out/
          retention-days: 14
      - name: Publikasikan ke Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="render-$(date -u +%Y%m%d-%H%M)"
          gh release create "$tag" out/xydesk-tiktok.mp4 out/preview.png \
            --draft --title "Render $tag" \
            --notes "720x1280 @ 60 fps. Commit ${GITHUB_SHA::7}. Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
